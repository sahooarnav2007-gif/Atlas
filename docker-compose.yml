version: "3.8"

services:
  atlas-app:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://atlas:atlas@postgres:5432/atlas
      - LLM_PROVIDER=deterministic_demo
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
